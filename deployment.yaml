apiVersion: apps/v1
kind: Deployment
metadata:
  name: practice-app
  namespace: practice
  labels:
    app: practice-app
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: practice-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0        # never go below 2 ready pods during an update
      maxSurge: 1
  template:
    metadata:
      labels:
        app: practice-app
    spec:
      # Prefer spreading the pods over your two worker nodes
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: practice-app
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: practice-app
          image: IMAGE_PLACEHOLDER            # Jenkins replaces this, e.g. practice-app:7
          imagePullPolicy: IfNotPresent       # the image is loaded into kind, not pulled
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: practice-app-config
          env:
            - name: APP_VERSION
              value: "VERSION_PLACEHOLDER"    # Jenkins replaces this with the build number
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          # Small limits: the kind workers are capped at 1.75 GiB each
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 250m, memory: 160Mi }
          securityContext:
            allowPrivilegeEscalation: false
